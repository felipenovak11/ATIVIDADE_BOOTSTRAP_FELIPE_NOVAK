    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

          <a class="navbar-brand fw-bold" href="index.html">DS • Bootstrap 5</a>

          <div class="collapse navbar-collapse" id="menuPortifolio">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">

              <li class="nav-item">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4">Clínica Vitale</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" placeholder="João" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Sobrenome</label>
                                <input type="text" class="form-control" placeholder="Oliveira" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Telefone</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                                    <input type="text" class="form-control" placeholder="+55 (41)">
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Área de Interesse</label>
                                <select class="form-select">
                                    <option selected>Escolha um opção ...</option>
                                    <option value="1">Oftalmologia</option>
                                    <option value="2">Cardiologia</option>
                                    <option value="3">Dermatologia</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <textarea name="Observações" id="Observações" placeholder="Observações..." cols="77" rows="4"></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" id="termos" class="form-check-input">
                                    <label for="termos" class="form-check-label">
                                        Concordo com os termos de uso de dados
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn btn-success w-100" type="submit">Finalizar Cadastro</button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
</body>
